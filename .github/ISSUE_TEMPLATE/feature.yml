name: Idea or improvement · 想法与改进
description: Propose a change · 提议一个改动
labels: [enhancement]
body:
  - type: textarea
    attributes: {label: Problem · 要解决的问题, description: "What is hard or slow today? · 现在哪里难用或慢？"}
    validations: {required: true}
  - type: textarea
    attributes: {label: Proposal · 方案}
  - type: textarea
    attributes: {label: How we'd measure it · 如何衡量, description: "Which probe, bench task or metric would show it worked? · 用哪个检测集、任务或指标证明有效？"}
